name: Build Signed World.apk (Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-12 g++-12 git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake

      - name: Prepare Android Build Directory
        run: |
          mkdir -p build_android/core
          MAIN_PY=$(find . -maxdepth 3 -name "main.py" ! -path "./build_android/*" | head -n 1)
          ENGINE_PY=$(find . -maxdepth 3 -name "lan_engine.py" ! -path "./build_android/*" | head -n 1)

          if [ -z "$MAIN_PY" ] || [ -z "$ENGINE_PY" ]; then
            echo "ERROR: Не найдены main.py или lan_engine.py в репозитории!"
            ls -la
            exit 1
          fi

          cp "$MAIN_PY" build_android/main.py
          cp "$ENGINE_PY" build_android/core/lan_engine.py
          touch build_android/core/__init__.py

          cat << 'EOF' > build_android/buildozer.spec
          [app]
          title = World
          package.name = worldlan
          package.domain = org.tural.world
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.4.0
          requirements = python3,kivy==2.3.0,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE,ACCESS_WIFI_STATE,CHANGE_WIFI_MULTICAST_STATE,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.allow_backup = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK with Buildozer
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          set -o pipefail
          pip install --upgrade pip
          pip install "setuptools<70.0" wheel "cython<3.0" buildozer appdirs colorama jinja2 "sh<2.0" build toml packaging
          cd build_android
          buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== ПОСЛЕДНИЕ 100 СТРОК ЛОГА ОШИБКИ ==="
            tail -n 100 build.log
            exit 1
          }

      - name: Sign APK with Author Keystore (CN=Tural)
        run: |
          RAW_APK=$(find build_android -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK файл не найден после сборки!"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore world_release.keystore \
            -alias world_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass world2026 -keypass world2026 \
            -dname "CN=Tural, OU=Dev, O=Tural, L=Local, C=RU"

          APKSIGNER=$(find "$HOME/.buildozer" /usr -name "apksigner" 2>/dev/null | head -n 1)
          ZIPALIGN=$(find "$HOME/.buildozer" /usr -name "zipalign" 2>/dev/null | head -n 1)

          "$ZIPALIGN" -f -p 4 "$RAW_APK" aligned_world.apk
          "$APKSIGNER" sign --ks world_release.keystore --ks-pass pass:world2026 --key-pass pass:world2026 --out World.apk aligned_world.apk

      - name: Upload Signed World.apk
        uses: actions/upload-artifact@v4
        with:
          name: World-Android-APK
          path: World.apk
